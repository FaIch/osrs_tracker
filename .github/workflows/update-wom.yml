name: Update WOM Snapshots

# Runs at 23:30 UTC daily to capture end-of-day progress.
# Can also be triggered manually via Actions tab.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update all players
        run: |
          update_player() {
            local name="$1"
            local encoded="$2"
            BODY=$(curl -s -w "\nHTTP_%{http_code}" -X POST \
              "https://api.wiseoldman.net/v2/players/${encoded}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: osrs-group-tracker/1.0")
            STATUS=$(echo "$BODY" | tail -1 | sed 's/HTTP_//')
            RESP=$(echo "$BODY" | head -1)
            echo "[$name] HTTP $STATUS — $RESP"
          }

          update_player "Flatlus Fred"  "Flatlus%20Fred"
          update_player "Gonore Geir"   "Gonore%20Geir"
          update_player "Skabb Svein"   "Skabb%20Svein"
          update_player "Kreft Kari"    "Kreft%20Kari"
